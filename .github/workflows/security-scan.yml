name: Security scan (temporary, read-only)
on:
  push:
    branches: [security-scan]
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sitemap as the monitor sees it
        run: |
          exec > scan-result.txt 2>&1
          for i in 1 2 3; do
            for UA in "site-monitor (GitHub Actions)" "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0 Safari/537.36"; do
              sleep 8
              echo "######## try $i UA=$UA"
              curl -sS -A "$UA" -D hdr.txt -o body.txt -w 'code=%{http_code} size=%{size_download} type=%{content_type}\n' "https://mitothrum.com/sitemap.xml?monitor=1"
              tr -d '\r' < hdr.txt | grep -i -E "^(server|cf-|x-|set-cookie|cache-control|content-type):"
              python3 -c "import xml.dom.minidom as m;m.parse('body.txt');print('XML OK')" 2>&1 | tail -1
              echo "-- lines:"; wc -l < body.txt; echo "-- start:"; head -c 300 body.txt | tr '\n' ' '; echo; echo "-- around line 93:"; sed -n '88,95p' body.txt | cut -c1-200
            done
          done
      - name: Save result to this branch
        run: |
          git config user.name "scan-bot"; git config user.email "scan-bot@users.noreply.github.com"
          git add scan-result.txt && git commit -m "scan result [skip ci]" && git push
