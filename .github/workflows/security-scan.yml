name: Security scan (temporary, read-only)
on:
  push:
    branches: [security-scan]
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Slow re-check with bodies
        run: |
          exec > scan-result.txt 2>&1
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for h in waterdamagegwinnett.com mitothrum.com; do
            for path in / /RULES.md /CLAUDE.md /.ftp-deploy-sync-state.json /.well-known/security.txt /README.md; do
              sleep 6
              echo "######## https://$h$path"
              curl -sS -A "$UA" -D hdr.txt -o body.txt -w 'code=%{http_code} size=%{size_download}\n' "https://$h$path"
              tr -d '\r' < hdr.txt | grep -i -E "^(HTTP|server|content-type|strict|content-security|x-frame|cf-|x-|set-cookie|location)" 
              echo "-- body start:"; head -c 600 body.txt | tr '\n' ' '; echo
            done
            sleep 6; echo "######## http://$h/ (no https)"; curl -sS -A "$UA" -o /dev/null -w 'code=%{http_code} -> %{redirect_url}\n' "http://$h/"
          done
      - name: Save result to this branch
        run: |
          git config user.name "scan-bot"; git config user.email "scan-bot@users.noreply.github.com"
          git add scan-result.txt && git commit -m "scan result [skip ci]" && git push
