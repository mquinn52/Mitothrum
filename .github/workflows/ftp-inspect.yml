# Manual diagnostic: lists the server folder with file modes, sizes and times.
# fix=false is read-only; fix=true resets web files to 644 (the deploy also
# does this). Posts its report as a comment on issue #3 (the Oct 23, 2026 403
# incident) — change the number if you reuse this for a later incident.
name: FTP inspect

on:
  workflow_dispatch:
    inputs:
      fix:
        description: "Reset unreadable site files to 644"
        type: boolean
        default: false
      archive_zips:
        description: "Move old upload zips into _to_delete/ (for deletion in cPanel)"
        type: boolean
        default: false
      recurse:
        description: "List every subfolder's files too"
        type: boolean
        default: false
      move_paths:
        description: "Paths to move into _to_delete/ (comma-separated)"
        type: string
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Inspect the FTP root
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FIX: ${{ inputs.fix && '1' || '0' }}
          ARCHIVE_ZIPS: ${{ inputs.archive_zips && '1' || '0' }}
          RECURSE: ${{ inputs.recurse && '1' || '0' }}
          MOVE_PATHS_CSV: ${{ inputs.move_paths }}
        run: |
          export MOVE_PATHS="$(printf '%s' "$MOVE_PATHS_CSV" | tr ',' '\n')"
          python3 -I .github/scripts/ftp_inspect.py
      - name: Post the report
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 3 -R "$GITHUB_REPOSITORY" --body-file report.txt
