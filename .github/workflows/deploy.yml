# Uploads the site to GoDaddy whenever main changes.
# Needs three repository secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
# The FTP account must be rooted at public_html/mitothrum.com (the site's own
# folder, where mitothrum.com is served from). public_html itself belongs to
# waterdamagegwinnett.com, so nothing here may ever deploy into it. The
# "Check the FTP target" step refuses to upload unless the FTP root looks like
# the mitothrum.com folder.
# Only files this workflow uploaded are ever updated or removed on the
# server, so the media/ folder already on GoDaddy is left alone.
name: Deploy to GoDaddy

on:
  push:
    branches: [main]
    # Research snapshots, rules and workflow edits don't change the site
    paths-ignore:
      - "research/**"
      - "RULES.md"
      - "CLAUDE.md"
      - "marketing/**"
      - ".github/**"
  workflow_dispatch:
    inputs:
      protocol:
        description: "ftps = encrypted (preferred). ftp = plain, for testing the connection only."
        type: choice
        options: [ftps, ftp]
        default: ftps

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v5

      - name: Test the connection to the FTP server
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          host="$(printf '%s' "$FTP_SERVER" | tr -d '[:space:]')"
          echo "Server value length: ${#host} characters"
          if timeout 15 bash -c "exec 3<>/dev/tcp/$host/21"; then
            echo "Port 21 is reachable."
          else
            echo "::warning::Could not open port 21 on the FTP server within 15 seconds. The address may be wrong, behind a CDN/firewall, or GoDaddy may be blocking GitHub's servers."
          fi

      - name: Check the FTP target is the mitothrum.com site folder
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 -I .github/scripts/check_ftp_target.py

      - name: Upload to public_html/mitothrum.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ inputs.protocol || 'ftps' }}
          port: 21
          timeout: 60000
          log-level: verbose
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            research/**
            RULES.md
            CLAUDE.md
            marketing/**
            media/**
            CHANGES.md
            README.md

      # FTP uploads keep a file's existing mode. A zip extracted on the server
      # on Oct 23, 2026 left pages at 0660 (unreadable to Apache: site-wide
      # 403), and deploys alone didn't repair it. Reset web files to 644.
      - name: Make site files readable (644)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FIX: "1"
          BRIEF: "1"
        run: python3 -I .github/scripts/ftp_inspect.py
